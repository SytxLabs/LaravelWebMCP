name: tests

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }} ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        livewire: ['3.*', '4.*']
        stability: [prefer-stable]
        include:
          - { laravel: '12.*', testbench: '^10.0' }
          - { laravel: '13.*', testbench: '^11.0' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', livewire: '3.*', stability: prefer-lowest }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo_sqlite
          coverage: none

      - name: Allow older dependency versions that have published advisories (matrix and lowest jobs)
        run: composer config audit.block-insecure false

      - name: Pin Laravel, Testbench and Livewire for this matrix entry
        run: >
          composer require --dev --no-interaction --no-update
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          "livewire/livewire:${{ matrix.livewire }}"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Pest
        run: vendor/bin/pest
